name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ "main", "master", "deployment", "AI-GEN" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nst-entrepreneurship-deployed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # AI-GEN is staging: keep it off the tags production pulls.
          tags: |
            type=raw,value=v1deployed,enable=${{ github.ref != 'refs/heads/AI-GEN' }}
            type=raw,value=latest,enable=${{ github.ref != 'refs/heads/AI-GEN' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/AI-GEN' }}
            type=sha,format=short,prefix=staging-,enable=${{ github.ref == 'refs/heads/AI-GEN' }}
            type=sha,format=short,enable=${{ github.ref != 'refs/heads/AI-GEN' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
